<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TradeDocs • AI Connection</title>
  <style>
    :root { --bg:#0b1220; --card:#111a2b; --text:#e6e9f0; --muted:#98a2b3; --primary:#6366f1; --border:#1f2a44; }
    * { box-sizing: border-box; }
    body { margin:0; font:500 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:var(--text); display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { width:100%; max-width:520px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 12px 32px rgba(0,0,0,.35); }
    h1 { margin:0 0 4px 0; font-size:18px; }
    p { margin:0 0 16px 0; color:var(--muted); }
    label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; }
    input, select { width:100%; background:#0f172a; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:12px 14px; outline:none; }
    input:focus, select:focus { border-color:var(--primary); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .btn { flex:1; background:#18223a; color:var(--text); border:1px solid var(--border); padding:12px 14px; border-radius:10px; cursor:pointer; }
    .btn.primary { background:var(--primary); border-color:transparent; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .note { font-size:12px; color:var(--muted); margin-top:8px; }
    .ok { color:#86efac; }
    .warn { color:#fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Conectar Provedor de IA</h1>
    <p>Selecione o provedor e devolva uma chave de API ou token de sessão.</p>
    <div style="margin-bottom:12px">
      <label for="provider">Provedor</label>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
      </select>
    </div>
    <div class="row" style="margin-bottom:12px">
      <div>
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="Cole a API key">
      </div>
      <div>
        <label for="token">Token</label>
        <input id="token" type="text" placeholder="Cole o token">
      </div>
    </div>
    <div class="actions">
      <button id="sendKey" class="btn primary">Enviar Key</button>
      <button id="sendToken" class="btn">Enviar Token</button>
    </div>
    <div id="status" class="note"></div>
    <p class="note">A janela tentará fechar automaticamente após o envio.</p>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const providerEl = $('provider');
    const apiKeyEl = $('apiKey');
    const tokenEl = $('token');
    const statusEl = $('status');
    const setStatus = (t, cls) => { statusEl.textContent = t; statusEl.className = 'note ' + (cls || ''); };
    const canTalk = typeof window.opener !== 'undefined' && window.opener && !window.opener.closed;
    const params = new URLSearchParams(window.location.search);
    const targetOrigin = params.get('target') || '*';
    const presetProvider = params.get('provider');
    if (presetProvider) { try { providerEl.value = presetProvider; } catch(e) {} }
    if (!canTalk) setStatus('Não foi possível detectar a janela de origem.', 'warn');
    const postBack = (payload) => {
      if (!canTalk) { setStatus('Sem janela de origem', 'warn'); return; }
      try {
        window.opener.postMessage(payload, targetOrigin);
        setStatus('Enviado', 'ok');
        setTimeout(() => { try { window.close(); } catch(e) {} }, 300);
      } catch (e) {
        setStatus('Falha ao enviar', 'warn');
      }
    };
    $('sendKey').onclick = () => {
      const provider = providerEl.value;
      const aiKey = apiKeyEl.value.trim();
      if (!aiKey) { setStatus('Informe a API key', 'warn'); return; }
      postBack({ type: 'TRADEDOCS_AUTH', provider, aiKey });
    };
    $('sendToken').onclick = () => {
      const provider = providerEl.value;
      const aiToken = tokenEl.value.trim();
      if (!aiToken) { setStatus('Informe o token', 'warn'); return; }
      postBack({ type: 'TRADEDOCS_AUTH', provider, aiToken });
    };
  </script>
  </body>
</html>
