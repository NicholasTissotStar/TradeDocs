<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TradeDocs Embed</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
    }
    .td-container {
      width: 100%;
      height: 100vh;
      max-height: 800px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(15,23,42,0.6);
      border: 1px solid rgba(148,163,184,0.3);
      background: radial-gradient(circle at top left, rgba(59,130,246,0.35), transparent 55%), #020617;
    }
    .td-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 16px;
      background: linear-gradient(to right, rgba(15,23,42,0.95), rgba(15,23,42,0.85));
      border-bottom: 1px solid rgba(30,64,175,0.5);
      color: #e5e7eb;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .td-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .td-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15,118,110,0.18);
      color: #a5f3fc;
      font-size: 10px;
    }
    .td-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.9);
    }
    .td-frame {
      width: 100%;
      height: calc(100% - 42px);
      border: none;
      display: block;
      background: #020617;
    }
  </style>
</head>
<body>
  <div class="td-container">
    <div class="td-header">
      <div class="td-header-left">
        <span class="td-dot"></span>
        <span>TRADEDOCS</span>
        <span class="td-pill">
          <span>AI DOCS</span>
        </span>
      </div>
    </div>
    <iframe
      class="td-frame"
      src="https://nicholastissotstar.github.io/TradeDocs/"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
</body>
</html>
